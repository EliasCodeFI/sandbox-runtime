name: Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

jobs:
  integration-tests:
    name: Tests (${{ matrix.os }} / ${{ matrix.label || matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
            os: linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            os: linux
          - arch: x86-64
            runner: macos-15-large
            os: macos
          - arch: arm64
            runner: macos-14
            os: macos
          # The newest macOS as well: the sandbox profile's own regex engine
          # and what Seatbelt refuses have both moved between releases, and
          # the two legs above stay on the images they name.
          - arch: arm64
            label: arm64-macos26
            runner: macos-26
            os: macos
          # Windows legs build srt-win, run the Rust smoke scripts,
          # then the TS integration suite (test/sandbox/winsrt.test.ts).
          - arch: x86-64
            runner: windows-latest
            os: windows
          - arch: arm64
            runner: windows-11-arm
            os: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The newest release of the oldest line that `engines` allows. Not
          # 22.12.0 itself: these tests also run `node` inside the sandbox,
          # and on Windows that release tries only `::1` for `localhost`,
          # where the proxy listens on 127.0.0.1. The floor itself is run by
          # the package check in release.yml.
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # The JVM proxy agent (vendor/java-proxy-agent) is built from source
      # here, like the seccomp helper; test/sandbox/java-proxy-agent.test.ts
      # then drives it in a real JVM and self-skips when jar or JDK is absent.
      - name: Setup Java (macOS/Linux)
        if: matrix.os != 'windows'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          # Its javac pattern stays on for the whole job and takes every
          # `file:line: warning:` for its own, autotools' included, which the
          # build of bubblewrap 0.4.1 below prints.
          problem-matcher: false

      # ─── Windows: srt-win helper binary ─────────────────────────────
      # GitHub-hosted Windows runners run as a member of Administrators
      # with UAC disabled, so NetLocalGroup* and Fwpm* calls succeed
      # without an explicit elevation step.
      - name: Setup Rust (Windows)
        if: matrix.os == 'windows'
        # Installs the version and components named in rust-toolchain.toml.
        run: rustup toolchain install

      - name: Rust build cache (Windows)
        if: matrix.os == 'windows'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vendor/srt-win-src

      - name: Build srt-win (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # pwsh does NOT fail the step on a native command's non-zero
          # exit by default — without this, `cargo test` failing would
          # be masked by `cargo clippy` exiting 0 on the next line.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build  --release --locked --manifest-path vendor/srt-win-src/Cargo.toml
          cargo test   --release --locked --manifest-path vendor/srt-win-src/Cargo.toml
          cargo clippy --release --locked --manifest-path vendor/srt-win-src/Cargo.toml --all-targets -- -D warnings
          # Test-only binary with the smoke hooks; its own target dir so
          # it never replaces the default-feature srt-win.exe.
          cargo build  --release --locked --manifest-path vendor/srt-win-src/Cargo.toml --features test-hooks --target-dir vendor/srt-win-src/target/test-hooks
          cargo clippy --release --locked --manifest-path vendor/srt-win-src/Cargo.toml --features test-hooks --target-dir vendor/srt-win-src/target/test-hooks --all-targets -- -D warnings

      - name: Smoke-test srt-win install lifecycle (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Smoke-test srt-win exec (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-exec.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Smoke-test srt-win additive-ACE lifecycle (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-aces.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Smoke-test srt-win kill-chain invariant (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-kill.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Smoke-test srt-win ambient write-deny lifecycle (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-ambient.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: srt-win machine-store smoke (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-machine-store.ps1 vendor\srt-win-src\target\release\srt-win.exe

      # Before the TS suite, with the other smokes: this is the child
      # token and the kept write grants the library uses by default.
      - name: Smoke-test srt-win write-restricted token (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-write-restricted.ps1 vendor\srt-win-src\target\release\srt-win.exe vendor\srt-win-src\target\test-hooks\release\srt-win.exe

      # On a made-up profile tree, never the runner's own: only the
      # test-hooks build can be pointed at one.
      - name: Smoke-test srt-win profile read grant (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-profile-read.ps1 vendor\srt-win-src\target\release\srt-win.exe vendor\srt-win-src\target\test-hooks\release\srt-win.exe

      - name: TS integration tests (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          # Husky's prepare hook chokes on Windows runners; skip it.
          HUSKY: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # A made-up profile for the suite (test-hooks build only),
          # outside the temp directory and the checkout.
          $env:SRT_WIN_TEST_PROFILE = Join-Path $env:RUNNER_TEMP 'srt-ts-profile'
          New-Item -ItemType Directory -Force -Path $env:SRT_WIN_TEST_PROFILE | Out-Null
          $env:SRT_WIN_TEST_HOOKS_EXE = (Resolve-Path 'vendor\srt-win-src\target\test-hooks\release\srt-win.exe').Path
          npm ci
          npm run build
          # These are listed explicitly because the non-Windows legs run the
          # whole tree: winsrt-paths.property is the only property suite over
          # the Windows path pipeline, glob-expand holds the UNC pass-raw
          # block that runs on no other leg, and config-validation covers the
          # schema on a real Windows host rather than under a platform spy.
          bun test test/sandbox/winsrt.test.ts test/sandbox/mux-proxy.test.ts test/sandbox/winsrt-paths.property.test.ts test/sandbox/glob-expand.test.ts test/config-validation.test.ts

      - name: Cleanup srt-win state (Windows)
        if: always() && matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/cleanup.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp-dev gcc socat apparmor-profiles zsh

      # The library reads both the output and the exit status of ripgrep, and
      # those differ between releases: for an unreadable directory exactly at
      # --max-depth, 14.1.1 prints "Permission denied" and exits 2, where
      # 15.2.0 passes over it and exits 0. 14.1.1 is what most installations
      # have, so every later step finds it first on PATH; the second full run
      # below puts 15.2.0 ahead of it. Both are upstream's archives, by the
      # checksums upstream publishes. macOS runs whatever Homebrew serves.
      - name: Install ripgrep 14.1.1 and 15.2.0 (Linux)
        if: matrix.os == 'linux'
        run: |
          install_ripgrep() {
            case "${{ matrix.arch }}" in
              x86-64) asset=ripgrep-$1-x86_64-unknown-linux-musl.tar.gz sha256=$2 ;;
              arm64) asset=ripgrep-$1-aarch64-unknown-linux-gnu.tar.gz sha256=$3 ;;
            esac
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "https://github.com/BurntSushi/ripgrep/releases/download/$1/$asset"
            echo "$sha256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
            mkdir "$RUNNER_TEMP/ripgrep-$1"
            tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/ripgrep-$1" --strip-components=1
            "$RUNNER_TEMP/ripgrep-$1/rg" --version
          }
          install_ripgrep 14.1.1 \
            4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e \
            c827481c4ff4ea10c9dc7a4022c8de5db34a5737cb74484d62eb94a95841ab2f
          install_ripgrep 15.2.0 \
            33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c \
            a740b91c82eaf9914cfedd353572f2791cbe0162c84101ee0951058f4dcbc90d
          echo "$RUNNER_TEMP/ripgrep-14.1.1" >> "$GITHUB_PATH"

      - name: Enable unprivileged user namespaces (Linux)
        if: matrix.os == 'linux'
        run: |
          # Ubuntu 24.04+ sets kernel.apparmor_restrict_unprivileged_userns=1 which
          # allows unshare(CLONE_NEWUSER) but grants the new namespace zero
          # capabilities. Disable it so bwrap and apply-seccomp can nest
          # namespaces without needing setuid.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

          # Same argv as bwrapCanNamespace() in test/helpers/bwrap-namespace.ts,
          # which whole suites use as `it.skipIf(!BWRAP_CAN_NAMESPACE)`. A host
          # that cannot nest namespaces must red the leg here rather than skip
          # those arms silently, so this runs unguarded.
          echo "Testing bwrap namespace creation..."
          bwrap --unshare-pid --unshare-user --cap-drop ALL --ro-bind / / --proc /proc true

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install ripgrep zsh

      - name: Install Node dependencies
        if: matrix.os != 'windows'
        run: npm ci

      # `npm run build` compiles src only. This is the one step that checks
      # the types of test/, which bun strips at runtime, save test/smoke,
      # which imports the built package: `npm run test:bundled` checks that.
      - name: Typecheck
        if: matrix.os != 'windows'
        run: npm run typecheck

      - name: Build seccomp binaries (Linux)
        if: matrix.os == 'linux'
        run: npm run build:seccomp

      - name: Build JVM proxy agent (macOS/Linux)
        if: matrix.os != 'windows'
        run: npm run build:java-agent

      - name: Build project
        if: matrix.os != 'windows'
        run: npm run build

      # After the build: without dist/ the rules that read types see `any`
      # throughout test/smoke, and report nothing there.
      - name: Lint (ESLint)
        if: matrix.os == 'linux' && matrix.arch == 'x86-64'
        run: npx eslint .

      - name: Run tests
        if: matrix.os != 'windows'
        run: npm test

      # The suites run the sources unbundled. An application that embeds the
      # library ships it minified and compiled to bytecode in one file, where
      # a function's name, its source text and the files beside it are all
      # gone. This compiles a small program that imports the built package
      # that way and has it wrap real commands.
      - name: Run the package bundled, minified and as bytecode
        if: matrix.os != 'windows'
        run: npm run test:bundled

      # bubblewrap 0.12 refuses a mount on a symlink destination, which the
      # distribution's packaged bubblewrap accepts; run the suite against it
      # as well so a profile that mounts on a link is caught here, not on a
      # user's machine. Pinned by commit, not by the v0.12.0 tag, which the
      # upstream repository can move.
      - name: Build bubblewrap 0.12.0 (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config
          git clone --filter=blob:none https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          cd "$RUNNER_TEMP/bubblewrap"
          git checkout 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          meson setup _build --prefix="$RUNNER_TEMP/bwrap-0.12" -Dselinux=disabled -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          ninja -C _build
          ninja -C _build install
          "$RUNNER_TEMP/bwrap-0.12/bin/bwrap" --version

      - name: Run tests against bubblewrap 0.12.0 and ripgrep 15.2.0 (Linux)
        if: matrix.os == 'linux'
        run: PATH="$RUNNER_TEMP/bwrap-0.12/bin:$RUNNER_TEMP/ripgrep-15.2.0:$PATH" npm test

      # RHEL 8 and 9 ship bubblewrap 0.4.0 and 0.4.1, the oldest versions in
      # current distribution use, and both refuse to start on a plan that
      # masks again a file a read deny has masked: before 0.5.0 a file bind's
      # mount point has to be a regular file, and that mask leaves /dev/null
      # there. Run the suites that build and run mount plans against 0.4.1,
      # the first of which starts bubblewrap on configurations that name one
      # file twice, so such a plan is caught here rather than on a user's
      # machine. Autotools, not meson, which that release predates. Pinned by
      # commit, not by the v0.4.1 tag, which the upstream repository can move.
      - name: Build bubblewrap 0.4.1 (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq autoconf automake libtool libcap-dev pkg-config
          git clone --filter=blob:none https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap-0.4"
          cd "$RUNNER_TEMP/bubblewrap-0.4"
          git checkout 5feb64dc60c936a7f9e424df9478aae9b88ee48a
          NOCONFIGURE=1 ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/bwrap-0.4" --disable-man --disable-selinux
          make
          make install
          "$RUNNER_TEMP/bwrap-0.4/bin/bwrap" --version

      - name: Run the mount-plan suites against bubblewrap 0.4.1 (Linux)
        if: matrix.os == 'linux'
        run: |
          PATH="$RUNNER_TEMP/bwrap-0.4/bin:$PATH" bun test \
            test/sandbox/linux-one-mount-per-destination.test.ts \
            test/sandbox/readonly-deny-dir-binds.test.ts \
            test/sandbox/readonly-deny-dir-stubs.test.ts \
            test/sandbox/linux-ancestor-pin.test.ts \
            test/sandbox/linux-mount-plan-record.test.ts \
            test/sandbox/path-canonicalization.test.ts \
            test/sandbox/credential-deny.test.ts \
            test/sandbox/symlink-boundary.test.ts \
            test/sandbox/stale-mount-point.test.ts

      - name: Run Node.js fallback tests
        if: matrix.os != 'windows'
        run: node test/utils/which-node-test.mjs

      # Everything above ran with Node 22 on PATH. What runs the library under
      # Node repeats on 24, in a step so that the matrix stays as it is.
      - name: Setup Node.js 24
        if: matrix.os != 'windows'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run the tests that use Node (Node 24)
        if: matrix.os != 'windows'
        run: npm run test:node

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.label || matrix.arch }}
          path: |
            test-results/
            *.log
          if-no-files-found: ignore

  docker-tests:
    name: Tests (docker / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # For the container below, which runs the built CLI with it.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable unprivileged user namespaces on host
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      # The suite runs twice in one container: first as uid 0 holding
      # CAP_SYS_ADMIN (a root parent on a VM; the sandbox must drop it, or a
      # sandboxed umount lifts any deny), then with it dropped (Docker's
      # default set: the unprivileged container enableWeakerNestedSandbox
      # exists for).
      - name: Run srt end-to-end as uid 0 in a container
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${{ github.workspace }}:/work" \
            -v "$(dirname "$(dirname "$(command -v node)")")":/opt/node:ro \
            -w /work \
            -e SRT_E2E_DOCKER=1 \
            ubuntu:24.04 \
            bash -euo pipefail -c '
              apt-get update -qq
              # node and npm are those of the runner, bound in, and not those
              # of the image, which has Node 18, below what engines in
              # package.json allows.
              apt-get install -y -qq bubblewrap socat ripgrep python3 curl ca-certificates unzip gcc libseccomp-dev libcap2-bin
              export PATH="/opt/node/bin:$PATH"
              node --version
              .github/scripts/install-bun.sh \
                36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913 \
                54328bbc2d9c8e0c9f892c544d66c57a83b84139e34909e5ee81758f1ac8fda7
              npm ci
              npm run build:seccomp
              npm run build
              echo "== as uid 0 with CAP_SYS_ADMIN"
              bun test test/docker-weak-sandbox.test.ts
              echo "== as uid 0 without CAP_SYS_ADMIN"
              capsh --drop=cap_sys_admin -- -c "bun test test/docker-weak-sandbox.test.ts"
            '

      # The same two runs on musl: bubblewrap, socat and ripgrep are Alpine's
      # own builds, and bun is its musl build. The seccomp helper is the one
      # the step above built, static against glibc, because that is the file
      # the npm package brings to a musl host. The rest of the checkout is
      # copied without what that step installed for glibc.
      - name: Run srt end-to-end as uid 0 in an Alpine container
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${{ github.workspace }}:/src:ro" \
            -e SRT_E2E_DOCKER=1 \
            alpine:3.22 \
            sh -euo pipefail -c '
              apk add --no-cache bash bubblewrap socat ripgrep python3 curl ca-certificates unzip libcap-utils libstdc++ libgcc nodejs npm tar
              mkdir /work
              tar -C /src --exclude=./node_modules --exclude=./dist --exclude=./.git -cf - . | tar -C /work -xf -
              cd /work
              .github/scripts/install-bun.sh \
                4835eca59d6da70f4674f5642f6e459dcadab773695b2ed9922d131057989742 \
                71760b6c8ea30623b81a4907cb815d48e2ea266f2e73e751534a44a0607950df \
                -musl
              npm ci
              npm run build
              echo "== as uid 0 with CAP_SYS_ADMIN"
              bun test test/docker-weak-sandbox.test.ts
              echo "== as uid 0 without CAP_SYS_ADMIN"
              capsh --drop=cap_sys_admin -- -c "bun test test/docker-weak-sandbox.test.ts"
              echo "== bundled, minified and as bytecode"
              npm run test:bundled
            '
